name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  # Rebuild diário: atualiza "último push", estrelas dos cards e a foto (avatar do GitHub).
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o site
        env:
          # Limite de requisições maior na API do GitHub durante o build.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --site e --base usam os padrões (https://igorhsalgado.github.io e /igorhsalgado-resume).
        run: npm run build

      - name: Upload do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
