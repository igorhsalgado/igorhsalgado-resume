name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  # Rebuild diário: atualiza "último push", estrelas dos cards e a foto (avatar do GitHub).
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # Sem dependências externas não há go.sum; o cache usa o go.mod.
          cache-dependency-path: go.mod

      - name: Gerar o site
        env:
          # Limite de requisições maior na API do GitHub durante o build.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # -site e -base usam os padrões (https://igorhsalgado.github.io e /igorhsalgado-resume).
        run: go run ./cmd/site -out dist

      - name: Upload do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
