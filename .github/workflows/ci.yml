name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tags bem fechadas, ids únicos, links internos e arquivos locais existentes,
      # nada carregado de outro site. Só Python, sem dependências.
      - name: Verificar o site
        run: python3 .github/scripts/verificar_site.py site
